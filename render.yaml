services:
  - type: web
    name: kidguard-api
    env: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kidguard-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        value: watotoguard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: kidguard-db
    databaseName: kidguard
    user: kidguard
    plan: free
