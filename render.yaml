services:
  - type: web
    name: kidguard-api
    env: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kidguard-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        value: watotoguard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SENDLIB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OTP_HASH_SECRET
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: kidguard-db
    databaseName: kidguard
    user: kidguard
    plan: free
