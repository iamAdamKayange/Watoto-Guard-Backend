services:
  - type: web
    name: kidguard-api
    env: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kidguard-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        value: watotoguard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SENDLIB_API_KEY
        sync: false
      - key: AI_ASSISTANT_HOST
        fromService:
          name: kidguard-ai-assistant
          type: pserv
          property: hostport
      - key: AI_ASSISTANT_SHARED_SECRET
        fromService:
          name: kidguard-ai-assistant
          type: pserv
          envVarKey: AI_ASSISTANT_SHARED_SECRET
      - key: OTP_HASH_SECRET
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: pserv
    name: kidguard-ai-assistant
    env: python
    rootDir: ai-assistant
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_ASSISTANT_SHARED_SECRET
        generateValue: true

databases:
  - name: kidguard-db
    databaseName: kidguard
    user: kidguard
    plan: free
