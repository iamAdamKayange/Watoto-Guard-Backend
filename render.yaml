services:
  - type: web
    name: watoto-guard-notification-worker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: watotoguard
      - key: LISTENER_LOOKBACK_MINUTES
        value: "120"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DAILY_SUMMARY_HOUR
        value: "18"
      - key: DAILY_SUMMARY_CHECK_MINUTES
        value: "15"
      - key: DAILY_SUMMARY_TZ_OFFSET_MINUTES
        value: "180"
